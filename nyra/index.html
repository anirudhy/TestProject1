<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyra's Birthday Party</title>
<meta name="description" content="You're invited to Nyra's birthday party!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
  /* Layout: one invitation card on a sprinkle-dotted wall; details as a ticket stub below the headline. Deliberately single-theme (a paper invitation). */
  :root {
    --wall: #FFE8DC;        /* peach wall */
    --card: #FFFDF8;        /* card stock */
    --ink: #2B2340;         /* plum ink */
    --muted: #6B6380;
    --pop: #FF5D73;         /* balloon pink */
    --sun: #FFC23D;         /* marigold */
    --sky: #4CB5E8;         /* sky blue */
    --mint: #3CC9A0;
    --display: "Gluten", "Comic Sans MS", "Trebuchet MS", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--wall);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,93,115,.18) 0 6px, transparent 7px),
      radial-gradient(circle at 70% 80%, rgba(76,181,232,.18) 0 5px, transparent 6px),
      radial-gradient(circle at 85% 20%, rgba(255,194,61,.25) 0 4px, transparent 5px);
    background-size: 120px 120px, 90px 90px, 70px 70px;
    color: var(--ink);
    font: 400 1.05rem/1.6 var(--body);
    padding-inline: 16px;
    padding-block: clamp(24px, 6vw, 64px);
    min-height: 100vh;
  }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .card {
    position: relative; z-index: 1;
    max-width: 640px; margin: 0 auto;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 2px 0 rgba(43,35,64,.06), 0 24px 60px -24px rgba(43,35,64,.35);
    padding: clamp(28px, 6vw, 56px) clamp(20px, 6vw, 56px) clamp(24px, 5vw, 44px);
    text-align: center;
    overflow: hidden;
  }
  .balloons { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .balloons svg { width: 34px; height: 56px; }
  .balloons svg:nth-child(2) { transform: translateY(-8px); }
  @media (prefers-reduced-motion: no-preference) {
    .balloons svg { animation: bob 3.2s ease-in-out infinite; }
    .balloons svg:nth-child(2) { animation-delay: -1s; }
    .balloons svg:nth-child(3) { animation-delay: -2s; }
    @keyframes bob { 50% { translate: 0 -6px; } }
  }
  .eyebrow {
    font-weight: 800; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); margin: 0;
  }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(3rem, 14vw, 5.6rem); line-height: .95;
    margin: .2em 0 .1em; color: var(--pop);
    text-wrap: balance;
    text-shadow: 3px 3px 0 var(--sun);
  }
  .sub { font-family: var(--display); font-weight: 600; font-size: clamp(1.3rem, 5vw, 1.8rem); margin: 0 0 .6em; }
  .lede { max-width: 32em; margin: 0 auto 28px; color: var(--muted); }

  .stub {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    border: 2px dashed rgba(43,35,64,.18); border-radius: 18px;
    text-align: left;
  }
  .stub > div { padding: 16px 18px; min-width: 0; }
  .stub > div + div { border-left: 2px dashed rgba(43,35,64,.18); }
  .stub .k { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .stub .when .k { color: var(--pop); }
  .stub .time .k { color: #D79400; }
  .stub .where .k { color: #2A8CBF; }
  .stub .v { display: block; font-weight: 800; font-size: 1.05rem; line-height: 1.3; margin-top: 4px; overflow-wrap: anywhere; }
  .stub .n { display: block; color: var(--muted); font-size: .9rem; margin-top: 2px; }
  @media (max-width: 520px) {
    .stub { grid-template-columns: 1fr; }
    .stub > div + div { border-left: 0; border-top: 2px dashed rgba(43,35,64,.18); }
  }

  .countdown { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 28px 0 8px; }
  .countdown div {
    min-width: 72px; padding: 10px 8px; border-radius: 14px; background: #FFF3D6;
    font-variant-numeric: tabular-nums;
  }
  .countdown b { display: block; font-family: var(--display); font-size: 2rem; line-height: 1; color: var(--ink); }
  .countdown span { font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .countdown-note { color: var(--muted); font-size: .9rem; margin: 0 0 24px; }

  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px; border-radius: 999px; font-weight: 800; text-decoration: none;
    border: 2px solid var(--ink); color: var(--ink); background: var(--card);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn.primary { background: var(--sky); border-color: var(--sky); color: #fff; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 -2px rgba(43,35,64,.2); }
  .btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  .notes { margin-top: 32px; padding-top: 24px; border-top: 2px dotted rgba(43,35,64,.15); text-align: left; }
  .notes h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0 0 8px; color: var(--mint); }
  .notes ul { margin: 0; padding-left: 1.2em; }
  .notes li + li { margin-top: 4px; }
  footer { text-align: center; margin-top: 28px; font-family: var(--display); font-size: 1.15rem; color: var(--pop); }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="card">
  <div class="balloons" aria-hidden="true">
    <svg viewBox="0 0 34 56"><ellipse cx="17" cy="17" rx="15" ry="17" fill="#FF5D73"/><path d="M17 34 l-3 4 h6z" fill="#FF5D73"/><path d="M17 38 q4 8 -2 18" stroke="#2B2340" stroke-width="1.2" fill="none"/></svg>
    <svg viewBox="0 0 34 56"><ellipse cx="17" cy="17" rx="15" ry="17" fill="#FFC23D"/><path d="M17 34 l-3 4 h6z" fill="#FFC23D"/><path d="M17 38 q-4 8 2 18" stroke="#2B2340" stroke-width="1.2" fill="none"/></svg>
    <svg viewBox="0 0 34 56"><ellipse cx="17" cy="17" rx="15" ry="17" fill="#4CB5E8"/><path d="M17 34 l-3 4 h6z" fill="#4CB5E8"/><path d="M17 38 q4 8 -2 18" stroke="#2B2340" stroke-width="1.2" fill="none"/></svg>
  </div>

  <p class="eyebrow">You're invited to</p>
  <h1 id="name">Nyra's Birthday</h1>
  <p class="sub" id="tagline">Come party with us!</p>
  <p class="lede" id="lede">Join us for cake, games, and lots of giggles as we celebrate Nyra's special day.</p>

  <section class="stub" aria-label="Party details">
    <div class="when"><span class="k">Date</span><span class="v" id="date-text"></span><span class="n" id="day-text"></span></div>
    <div class="time"><span class="k">Time</span><span class="v" id="time-text"></span><span class="n">Drop in anytime</span></div>
    <div class="where"><span class="k">Where</span><span class="v" id="place-text"></span><span class="n" id="address-text"></span></div>
  </section>

  <div class="countdown" id="countdown" aria-live="polite">
    <div><b id="cd-days">0</b><span>days</span></div>
    <div><b id="cd-hours">0</b><span>hours</span></div>
    <div><b id="cd-mins">0</b><span>mins</span></div>
  </div>
  <p class="countdown-note" id="cd-note">until the party starts</p>

  <div class="actions">
    <a class="btn primary" id="cal-link" href="#" target="_blank" rel="noopener">Add to Google Calendar</a>
    <a class="btn" id="map-link" href="#" target="_blank" rel="noopener">Get directions</a>
  </div>

  <section class="notes">
    <h2>Good to know</h2>
    <ul id="notes"></ul>
  </section>

  <footer id="rsvp"></footer>
</main>

<script>
  // ===== Edit the party details here =====
  const PARTY = {
    name: "Nyra",
    start: "2026-11-14T15:00:00-08:00",   // date + start time (Pacific)
    end:   "2026-11-14T18:00:00-08:00",
    placeName: "Our Home",
    address: "Seattle, WA",               // replace with your full street address
    notes: [
      "Kids and grown-ups are both welcome.",
      "Comfy clothes recommended, there will be games!",
      "Your presence is the only present we need."
    ],
    rsvp: "Please RSVP by text to Anirudh"
  };
  // =======================================

  const start = new Date(PARTY.start), end = new Date(PARTY.end);
  const tz = "America/Los_Angeles";
  const $ = id => document.getElementById(id);

  $("name").textContent = `${PARTY.name}'s Birthday`;
  document.title = `${PARTY.name}'s Birthday Party`;
  $("date-text").textContent = start.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric", timeZone: tz });
  $("day-text").textContent = start.toLocaleDateString("en-US", { weekday: "long", timeZone: tz });
  const t = d => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: tz });
  $("time-text").textContent = `${t(start)} – ${t(end)}`;
  $("place-text").textContent = PARTY.placeName;
  $("address-text").textContent = PARTY.address;
  $("rsvp").textContent = PARTY.rsvp;
  PARTY.notes.forEach(n => { const li = document.createElement("li"); li.textContent = n; $("notes").appendChild(li); });

  const gcal = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  $("cal-link").href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(`${PARTY.name}'s Birthday Party`)
    + "&dates=" + gcal(start) + "/" + gcal(end)
    + "&location=" + encodeURIComponent(PARTY.address)
    + "&details=" + encodeURIComponent(`Celebrate ${PARTY.name}'s birthday with us!`);
  $("map-link").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(PARTY.address);

  function tick() {
    const ms = start - Date.now();
    if (ms <= 0) {
      $("countdown").hidden = true;
      $("cd-note").textContent = Date.now() < end ? "The party is happening now!" : "Thanks for celebrating with us!";
      return;
    }
    $("cd-days").textContent = Math.floor(ms / 864e5);
    $("cd-hours").textContent = Math.floor(ms / 36e5) % 24;
    $("cd-mins").textContent = Math.floor(ms / 6e4) % 60;
  }
  tick(); setInterval(tick, 30000);

  // A short burst of confetti on load (skipped for reduced-motion users)
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const c = $("confetti"), x = c.getContext("2d");
    const colors = ["#FF5D73", "#FFC23D", "#4CB5E8", "#3CC9A0"];
    let W, H, bits = [];
    const size = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
    size(); addEventListener("resize", size);
    for (let i = 0; i < 120; i++) bits.push({
      x: Math.random() * W, y: -20 - Math.random() * H * .6,
      vx: (Math.random() - .5) * 1.5, vy: 2 + Math.random() * 3,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * .2,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: colors[i % 4]
    });
    const frame = () => {
      x.clearRect(0, 0, W, H);
      bits = bits.filter(b => b.y < H + 20);
      for (const b of bits) {
        b.x += b.vx; b.y += b.vy; b.r += b.vr;
        x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c;
        x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); x.restore();
      }
      if (bits.length) requestAnimationFrame(frame); else x.clearRect(0, 0, W, H);
    };
    requestAnimationFrame(frame);
  }
</script>
</body>
</html>
